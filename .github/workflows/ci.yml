name: CI

on:
  push:
    branches: [main]
    # Data commits can't break the code; skip CI for them.
    paths-ignore:
      - "data/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        # Fixtures only — never hits a live source, so CI can't go red
        # because Zillow was slow. The scheduled job is the live test.
        run: pytest -q
