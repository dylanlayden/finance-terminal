name: Refresh data

on:
  schedule:
    # 22:00 UTC = 6pm EDT / 5pm EST. Fixed UTC, so it drifts an hour across
    # DST — accepted: every tile carries its own as_of date.
    - cron: "0 22 * * 1-5"
    # Keepalive. GitHub disables schedules after 60 days without repo
    # activity, which would silently freeze the whole board.
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch all metrics
        env:
          FRED_API: ${{ secrets.FRED_API }}
        run: python -m terminal.runner

      - name: Commit data
        run: |
          git config user.name "terminal-bot"
          git config user.email "actions@github.com"
          # Stage first: `git diff` alone ignores untracked files, so a run
          # that creates a metric's very first CSV would look like a no-op.
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          # Rebase before pushing: a manual dispatch and the cron can race.
          git pull --rebase --autostash origin main
          git push --force-with-lease origin main
