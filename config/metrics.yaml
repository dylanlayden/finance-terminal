    dashboard: real_estate
    label: FHFA House Price Index
    source: fred
    series_id: HPIPONM226S
    unit: index
    frequency: quarterly
    change_style: pct
    source_url: https://fred.stlouisfed.org/series/HPIPONM226S

  - id: mortgage_30yr
    dashboard: real_estate
    label: 30-Yr Mortgage Rate
    source: fred
    series_id: MORTGAGE30US
    unit: "%"
    frequency: weekly
    change_style: pp
    source_url: https://fred.stlouisfed.org/series/MORTGAGE30US

  - id: housing_starts
    dashboard: real_estate
    label: Housing Starts
    source: fred
    series_id: HOUST
    unit: thousands SAAR
    frequency: monthly
    change_style: pct
    source_url: https://fred.stlouisfed.org/series/HOUST

  - id: for_sale_inventory
    dashboard: real_estate
    label: For-Sale Inventory
    source: zillow
    series_id: inventory_us_sa
    unit: count
    frequency: monthly
    change_style: pct
    source_url: https://www.zillow.com/research/data/

  - id: sf_zhvi
    dashboard: real_estate
    label: SF Home Value Index
    source: zillow
    series_id: zhvi_sf_city
    unit: index $
    frequency: monthly
    change_style: pct
    source_url: https://www.zillow.com/research/data/

  - id: sf_zori
    dashboard: real_estate
    label: SF Observed Rent
    source: zillow
    series_id: zori_sf_city
    unit: $
    frequency: monthly
    change_style: pct
    source_url: https://www.zillow.com/research/data/

  - id: sf_for_sale_inventory
    dashboard: real_estate
    label: SF For-Sale Inventory
    source: zillow
    series_id: inventory_sf_city
    unit: count
    frequency: monthly
    change_style: pct
    source_url: https://www.zillow.com/research/data/

  - id: sf_new_listings
    dashboard: real_estate
    label: SF New Listings
    source: zillow
    series_id: new_listings_sf_city
    unit: count
    frequency: monthly
    change_style: pct
    source_url: https://www.zillow.com/research/data/

  - id: sf_median_list_price
    dashboard: real_estate
    label: SF Median List Price
    source: zillow
    series_id: median_list_price_sf_city
    unit: $
    frequency: monthly
    change_style: pct
    source_url: https://www.zillow.com/research/data/

  - id: sf_price_cut_pct
    dashboard: real_estate
    label: SF Avg Price Cut
    source: zillow
    series_id: price_cut_pct_sf_city
    unit: "%"
    frequency: monthly
    change_style: pp
    source_url: https://www.zillow.com/research/data/

  - id: sf_days_to_pending
    dashboard: real_estate
    label: SF Days to Pending
    source: zillow
    series_id: days_to_pending_sf_city
    unit: days
    frequency: monthly
    change_style: pct
    source_url: https://www.zillow.com/research/data/

  - id: sf_housing_permits
    dashboard: real_estate
    label: SF MSA Housing Permits
    source: fred
    series_id: SANF806BPPRIVSA
    unit: count
    frequency: monthly
    change_style: pct
    source_url: https://fred.stlouisfed.org/series/SANF806BPPRIVSA

  - id: tahoe_zhvi_basket
    dashboard: real_estate
    label: Tahoe Home Value Basket
    source: zillow
    series_id: zhvi_tahoe_basket
    unit: index $
    frequency: monthly
    change_style: pct
    source_url: https://www.zillow.com/research/data/

  # --- Macro ---------------------------------------------------------------
  - id: treasury_10yr
    dashboard: macro
    label: 10-Yr Treasury
    source: fred
    series_id: DGS10
    unit: "%"
    frequency: daily
